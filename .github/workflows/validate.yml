name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python lint
        run: |
          python -m pip install ruff==0.12.10
          python -m ruff check .
          python -m ruff format --check .
      - name: Compile Python sources
        run: python -m compileall -q custom_components/fazenda_irrigation
      - name: Card behavior tests
        run: node tests/test_fazenda_irrigation_card.mjs
